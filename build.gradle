plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.10'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
	id 'checkstyle'
}

group = 'com.udla'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-h2console'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.0'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

tasks.named('test') {
	useJUnitPlatform()
	// Siempre generar el reporte de cobertura después de las pruebas
	finalizedBy tasks.named('jacocoTestReport')
}

// ==========================================================
// Calidad de código (Persona 4): JaCoCo + Checkstyle
// ==========================================================

// Clases que no aportan lógica a probar (arranque de Spring Boot)
def jacocoExcludes = [
	'com/udla/todolist/ToDoListApiApplication*'
]

jacoco {
	toolVersion = '0.8.13'
}

jacocoTestReport {
	dependsOn tasks.named('test')
	reports {
		xml.required = true   // lo usa GitLab para mostrar cobertura
		html.required = true  // reporte navegable: build/reports/jacoco/test/html/index.html
		csv.required = false
	}
	classDirectories.setFrom(files(classDirectories.files.collect {
		fileTree(dir: it, exclude: jacocoExcludes)
	}))
}

jacocoTestCoverageVerification {
	dependsOn tasks.named('test')
	classDirectories.setFrom(files(classDirectories.files.collect {
		fileTree(dir: it, exclude: jacocoExcludes)
	}))
	violationRules {
		rule {
			// Cobertura mínima de líneas exigida: 70 %
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.70
			}
		}
	}
}

checkstyle {
	toolVersion = '10.21.4'
	configFile = file('config/checkstyle/checkstyle.xml')
	ignoreFailures = false
	maxWarnings = 0
}

// `./gradlew check` ejecuta pruebas + Checkstyle + verificación de cobertura mínima
tasks.named('check') {
	dependsOn tasks.named('jacocoTestCoverageVerification')
}

bootJar {
	archiveFileName = 'to-do-list-api-0.0.1-SNAPSHOT.jar'
}
