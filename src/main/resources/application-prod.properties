# Perfil PROD (Despliegue en AWS EC2)
# Almacenamiento en archivo persistente en la instancia EC2
spring.datasource.url=jdbc:h2:file:/home/ubuntu/to-do-list-api/data/todolistdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=prodpassword

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Por seguridad, deshabilitar consola H2 en producción
spring.h2.console.enabled=false
