image: gradle:jdk17

# Asegura permisos de ejecución en todos los contenedores del pipeline
before_script:
  - chmod +x gradlew

stages:
  - build
  - test
  - quality
  - packing
  - deploy
  - verify

build_job:
  stage: build
  script:
    - ./gradlew compileJava

test_job:
  stage: test
  script:
    - ./gradlew test
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/**/TEST-*.xml
    paths:
      - build/test-results/test/
      - build/reports/tests/test/

quality_job:
  stage: quality
  script:
    - ./gradlew jacocoTestReport
  artifacts:
    when: always
    paths:
      - build/reports/jacoco/test/
  allow_failure: true

packing_job:
  stage: packing
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
  script:
    - ./gradlew bootJar
  artifacts:
    paths:
      - build/libs/*.jar
